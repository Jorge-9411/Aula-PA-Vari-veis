<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pastelaria do Luisinho</title>

        <style>
            h1, p, label {
                font-family:Arial, Helvetica, sans-serif
            }
            .centralizar{
                text-align:center;
            }

                main{
                display:flex;
            justify-content:center;
            }
             form{
                background-color:rgb(255, 196, 0);
                padding:20px;
                width:60%;
                display: grid;
                border-radius: 20px;
            }

            img{
                width:20%;
                display:block;
                margin:auto;
            }
            .campo{
                margin-bottom: 15px;
            }

            #container-sabores{
                display: flex;
                flex-direction: column;
                margin-bottom: 15px;
            }

            .item{
                margin-bottom: 10px;
            }

            body{
                background-image: url("imagens/Pastel_Fundo.avif");
                background-color: rgba(255, 255, 255, 0.6);
                background-blend-mode: lighten;
                background-repeat: no-repeat;
                background-size: cover;
            }

            button{
                margin-top: 40px;
                height: 50px;
                background-color: rgba(255, 230, 0, 0.993);
                color:rgb(255, 0, 85);
                border: 0;
                border-radius: 8px;
                font-size: 16px;
                font-weight: bold;
            }
        </style>
    </head>
    <body>
        <header>
            <img src="imagens/logo.png" alt="">
            <h1 class="centralizar">Formulário de Inscrição</h1>
            <p class="centralizar">Inscrição para experimentar e avaliar os deliciosos pastéis da Pastelaria do Luisinho.</p>
           
        </header>
        
        <main>
            
            <form>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" class="campo">

                <label for="email">E-mail:</label>
                <input type="email" id="email" class="campo">

                <label for="tel">Telefone (apenas números):</label>
                <input type="number" id="tel" class="campo">

                <label for="senha">Senha de acesso ao sistema:</label>
                <input type="password" id="senha" class="campo">

                <label for="confirmacao-senha">Confirmação da senha:</label>
                <input type="password" id="confirmacao-senha" class= "campo">

                <p> Selecione os sabores favoritos</p>
                <div id="container-sabores"> 
                    <label class="item"><input type="checkbox">Queijo</label>
                    <label class="item"><input type="checkbox">Calabresa</label>
                    <label class="item"><input type="checkbox">Frango com Catupiry</label>
                    <label class="item"><input type="checkbox">Carne</label>
                    <label class="item"><input type="checkbox">Frango</label>
                </div>

                <label for="comentário">Comentário sobre os pastéis:</label>
                <textarea rows="4" id="comentário"> </textarea>

                <button type="submit"> Enviar Inscrição</button>
            </form>
        </main>
    </body>
</html>
